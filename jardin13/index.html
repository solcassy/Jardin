<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radaville — Clone</title>

  <!-- Tipos de letra elegantes similares -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b0b;
      --fg:#ffffff;
      --muted:#b6b6b6;
      --btn:#eee7df;
      --btnText:#1b1b1b;
      --maxw:780px;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Lienzo centrado */
    .wrap{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:48px 20px;
    }

    .hero{
      text-align:center;
      width:min(90vw, var(--maxw));
    }

    /* Arco (imagen con top redondeado) */
    .arch{
      width:min(40vw, 320px);
      max-width:320px;
      margin:0 auto 28px;
      aspect-ratio: 3 / 5;              /* mantiene proporción visual tipo póster */
      border-top-left-radius: 999px 999px;
      border-top-right-radius: 999px 999px;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      overflow:hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.55);
      background:#222;
    }
    .arch img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      transform:translateZ(0); /* suaviza */
    }

    /* Eyebrow (subtítulo pequeño) */
    .eyebrow{
      font-size:12px;
      letter-spacing:.17em;
      text-transform:uppercase;
      color:var(--muted);
      margin:10px 0 18px;
    }

    /* Título elegante multilínea */
    .title{
      font-family: "Cormorant Garamond", serif;
      font-weight:600;
      font-size: clamp(28px, 4.4vw, 44px);
      line-height:1.15;
      letter-spacing:.02em;
      margin:0 0 24px;
    }

    /* Botón */
    .cta{
      display:inline-block;
      padding:12px 28px;
      border-radius:999px;
      background:var(--btn);
      color:var(--btnText);
      font-weight:600;
      font-size:14px;
      text-decoration:none;
      transition: transform .15s ease, filter .15s ease;
    }
    .cta:hover{ transform:translateY(-1px); filter:brightness(.96); }
    .cta:active{ transform:translateY(0); filter:brightness(.92); }

    .dots{
      margin:26px 0 8px;
      letter-spacing:.5em;
      color:#8d8d8d;
    }

    .hint{
      margin-top:10px;
      font-size:11px;
      letter-spacing:.12em;
      color:#8d8d8d;
    }

    /* Pequeño respiro en pantallas muy bajas */
    @media (max-height:640px){
      .wrap{ padding-block:28px; }
      .arch{ margin-bottom:18px; }
      .title{ margin-bottom:18px; }
      .dots{ margin-top:18px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero" role="main">
      <div class="arch" aria-hidden="true">
        <!-- Reemplaza la URL por tu imagen -->
        <img src="https://images.unsplash.com/photo-1519710164239-da123dc03ef4?q=80&w=1200&auto=format&fit=crop" alt="Interior cálido con arco">
      </div>

      <p class="eyebrow">A multi-disciplinary design studio</p>

      <h1 class="title">
        Elevating Spaces,<br>
        Defining Aesthetics, Cultivating Brands
      </h1>

      <a class="cta" href="#">Enter</a>

      <div class="dots">••••</div>
      <p class="hint">(Click anywhere for sound)</p>
    </section>
  </main>
</body>
</html>
