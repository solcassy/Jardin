<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sol Cassy | Creative Designer</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #F8F8F8;
      color: black;
      text-align: center;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 60px;
      background-color: #F8F8F8;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background-color: #4A5568;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon::before {
      content: '';
      width: 20px;
      height: 20px;
      background-color: #A0AEC0;
      border-radius: 50%;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo-text .name {
      font-size: 24px;
      font-weight: bold;
      line-height: 1;
      margin: 0;
    }

    .logo-text .surname {
      font-size: 20px;
      font-weight: bold;
      line-height: 1;
      margin: 0;
    }

    nav {
      display: flex;
      gap: 40px;
    }

    nav a {
      text-decoration: none;
      color: black;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    nav a::before {
      content: '[ ';
    }

    nav a::after {
      content: ' ]';
    }

    .contact-btn {
      text-decoration: underline;
      color: #333;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .contact-btn::after {
      content: '↗';
      font-size: 12px;
    }

    main {
      margin-top: 30px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 220px;
      letter-spacing: 2px;
      margin: 0;
    }

    .subtitle {
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 8px;
      margin: 10px 0 30px;
    }

    .content-section {
      display: flex;
      align-items: center;
      gap: 60px;
      margin-bottom: 40px;
      justify-content: center;
    }

    .roles {
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: left;
    }

    .roles p {
      margin: 0;
      font-weight: 600;
      font-size: 16px;
    }

    img {
      width: 350px;
      border-radius: 6px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      border-top: 1px solid #ccc;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      <div class="logo-text">
        <div class="name">SOL</div>
        <div class="surname">CASSY</div>
      </div>
    </div>
    <nav>
      <a href="#">ABOUT ME</a>
      <a href="#">WORKS</a>
      <a href="#">SERVICES</a>
      <a href="#">CONNECT</a>
    </nav>
    <a href="#" class="contact-btn">CONTACT ME</a>
  </header>

  <main>
    <h1>CREATIVE DESIGNER</h1>

    <div class="content-section">
      <div class="roles">
        <p>/ ART DIRECTION</p>
        <p>/ WEB DESIGN (UX/UI)</p>
        <p>/ WEB DEVELOPMENT</p>
      </div>

      <img src="img.png" alt="Portrait">
    </div>

    <p>I'M AN EXPERIENCED WEB AND UX/UI DESIGNER WHO CREATES MEMORABLE WEB EXPERIENCES FOR BRANDS OF ALL SIZES.</p>
  </main>
</body>
</html>
