<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
    </style>
  <title>Jam Area</title>
  <style>
    body {
      background-color: #faf8f3;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
    }

    /* Menú arriba */
    .menu-bar {
      display: flex;
      justify-content: space-between;
      padding: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .dot {
      width: 10px;
      height: 10px;
      background-color: black;
      display: inline-block;
      margin-right: 5px;
    }

    /* Título */
    h2 {
      font-size: 24px;
      margin-top: 40px;
      letter-spacing: 1px;
    }

    /* Imagen central simulada */
    .card {
      background-color: #9166ff;
      width: 150px;
      height: 200px;
      margin: 50px auto;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
    }

    /* Texto principal */
    .info {
      margin-top: 40px;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
    }

    /* Palabras grandes abajo */
    .big-words {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      font-size: 200px;
      font-weight: 900;
      font-family: 'Bebas Neue', Arial, sans-serif;
    }

    /* Pie de página */
    .footer {
      margin-top: 20px;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="menu-bar">
    <div><span class="dot"></span> MENU</div>
    <div>WRITE</div>
  </div>

  <h2>ESTRA SPA - VINCI LA PARTITA STRAORDINARIA</h2>

  <div class="card">
    Imagen
  </div>

  <div class="info">
    © JAMAREA <br>
    COMMUNICATION AGENCY <br>
    BRANDING AND DIGITAL MARKETING
  </div>

  <div class="big-words">
    <div>JAM</div>
    <div>AREA</div>
  </div>

  <div class="footer">
    LET’S JAM
  </div>

</body>
</html>
