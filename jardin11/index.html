<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VAP remake — Three.js</title>
  <style>
    :root{
      --w:1440px;
      --h:750px;
      --accent:#ff5a1f; /* botón contact */
      --chip:#eee1c6;   /* botón menu */
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#111; /* margen exterior oscuro por si la ventana es más grande */
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      color:#fff;
    }

    /* Lienzo del layout (fijo 1440x750) */
    .stage{
      position:relative;
      width:var(--w);
      height:var(--h);
      background:#000;
      overflow:hidden;
    }

    /* Header */
    .logo{
      position:absolute; inset:24px auto auto 24px;
      display:flex; gap:6px;
    }
    .logo .dot{
      width:18px;height:18px;border-radius:3px;background:#fff;
      clip-path: path("M2 0 H16 A2 2 0 0 1 18 2 V16 A2 2 0 0 1 16 18 H2 A2 2 0 0 1 0 16 V2 A2 2 0 0 1 2 0 Z");
      /* mini marca cuadradita como placeholder */
    }

    .top-buttons{
      position:absolute; 
      top:24px; 
      right:24px; 
      display:flex; 
      gap:12px;
      z-index:10;
    }
    .btn{
      padding:10px 18px; border-radius:10px; font-weight:700; font-size:14px;
      line-height:1; border:none; cursor:pointer;
    }
    .btn.contact{ background:var(--accent); color:#000; }
    .btn.menu{ background:var(--chip); color:#000; }

    /* Canvas de Three */
    canvas.webgl{
      position:absolute; inset:0; width:100%; height:100%;
      display:block;
      pointer-events:auto;
      z-index:1;
    }
    .logo{
      z-index:10;
      position:relative;
    }

    /* Textos inferiores */
    .bottom{
      position:absolute; inset:auto 24px 24px 24px; display:flex;
      justify-content:space-between; align-items:flex-end; width:calc(100% - 48px);
      font-size:14px; color:#cfcfcf;
      letter-spacing:.2px;
    }
    .col{max-width:320px}
    .col p{margin:.25rem 0}
    .showreel{
      position:absolute; right:24px; bottom:24px;
      display:flex; align-items:center; gap:10px;
    }
    .thumb{
      width:150px; height:90px; background:#1a1a1a; border-radius:10px; overflow:hidden;
      display:grid; place-items:center; font-weight:700; border:1px solid #333;
    }
    .dl{
      width:36px;height:36px;border-radius:50%; background:#ff8c00;
      border:none;cursor:pointer; font-weight:900;
    }

    /* Ayudín visual para centrar la composición en ventanas pequeñas */
    @media (max-width: 1440px){
      .stage{transform:scale(calc(100vw / 1440)); transform-origin: top left;}
      body{place-items:start center}
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- Logo (placeholder geométrico) -->
    <div class="logo" aria-label="VAP logo">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <!-- Botones arriba derecha -->
    <div class="top-buttons">
      <button class="btn contact">contact</button>
      <button class="btn menu">menu</button>
    </div>

    <!-- Canvas Three.js -->
    <canvas class="webgl" id="webgl"></canvas>

    <!-- Copys inferiores -->
    <div class="bottom">
      <div class="col">
        <p>video as</p><p><strong>playground</strong></p>
      </div>
      <div class="col" style="text-align:center">
        <p>studio de</p><p><strong>création vidéo</strong></p>
      </div>
      <div class="col" style="text-align:right">
        <p>born to</p><p><strong>be online</strong></p>
      </div>
    </div>

    <!-- Showreel (thumb + “descargar”) -->
    <div class="showreel">
      <div class="thumb">MOTION DESIGN</div>
      <button class="dl" title="download">↓</button>
    </div>
  </div>

  <!-- Three.js and GSAP from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
